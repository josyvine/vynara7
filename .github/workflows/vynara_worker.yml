name: Vynara Blender Worker

on:
  repository_dispatch:
    types: [vynara_generate, vynara_agentic_auto, vynara_agentic_interactive, vynara_neural_reconstruct]

jobs:
  build_3d_asset:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Check GitHub Actions Cache (Restores in ~3s on Run 2+)
      - name: Restore Blender Cache
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: /opt/blender
          key: blender-4.2-linux-x64

      # Step 2: Download ONLY on first run (Skipped on all future runs)
      - name: Download Blender Binary
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/blender
          curl -sL https://download.blender.org/release/Blender4.2/blender-4.2.0-linux-x64.tar.xz | sudo tar -xJ --strip-components=1 -C /opt/blender

      # Step 3: Install Virtual Display Server, Media Libraries, EGL Drivers & 3D Conversion Tools
      - name: Install Headless Display Server (Xvfb), FFmpeg, EGL and Assimp
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg libsm6 libxext6 libgl1 libegl1 libgl1-mesa-dri assimp-utils

      # Step 4: Ingest and Auto-Convert Uploaded 3D Models (Resolves ASCII FBX limitation)
      - name: Ingest and Prepare 3D Model
        run: |
          mkdir -p inputs
          
          python3 -c "
          import json, os, base64
          event_path = os.environ.get('GITHUB_EVENT_PATH')
          if event_path and os.path.exists(event_path):
              try:
                  with open(event_path, 'r', encoding='utf-8') as ef:
                      event_data = json.load(ef)
                      payload = event_data.get('client_payload', {})
                      input_model_b64 = payload.get('input_model_b64', '')
                      if input_model_b64 and input_model_b64.strip():
                          with open('input_model.glb', 'wb') as mf:
                              mf.write(base64.b64decode(input_model_b64))
                          os.makedirs('inputs', exist_ok=True)
                          with open('inputs/input_model.glb', 'wb') as mf2:
                              mf2.write(base64.b64decode(input_model_b64))
                          print('Early unpacked base64 model: input_model.glb')
              except Exception as e:
                  print(f'Early payload read notice: {e}')
          "

          MODEL_PATH="${{ github.event.client_payload.model_path }}"

          if [ -n "$MODEL_PATH" ] && [ -f "$MODEL_PATH" ]; then
            EXT="${MODEL_PATH##*.}"
            cp "$MODEL_PATH" "input_model.$EXT"
            cp "$MODEL_PATH" "inputs/input_model.$EXT" 2>/dev/null || true
            echo "Ingested input model from $MODEL_PATH -> input_model.$EXT ($(stat -c%s input_model.$EXT) bytes)"
          elif [ -d "inputs" ]; then
            FOUND_FILE=$(find inputs -type f \( -name "*.fbx" -o -name "*.glb" -o -name "*.gltf" -o -name "*.obj" \) | head -n 1)
            if [ -n "$FOUND_FILE" ]; then
              EXT="${FOUND_FILE##*.}"
              cp "$FOUND_FILE" "input_model.$EXT"
              echo "Ingested auto-detected model: $FOUND_FILE -> input_model.$EXT ($(stat -c%s input_model.$EXT) bytes)"
            fi
          fi

          for fbx_candidate in "input_model.fbx" "inputs/input_model.fbx"; do
            if [ -f "$fbx_candidate" ]; then
              if ! head -c 20 "$fbx_candidate" | grep -q "Kaydara FBX Binary"; then
                echo "Detected ASCII FBX at $fbx_candidate. Auto-converting via assimp..."
                assimp export "$fbx_candidate" "input_model.glb"
                if [ -f "input_model.glb" ] && [ -s "input_model.glb" ]; then
                  echo "Successfully converted ASCII FBX -> input_model.glb"
                  cp "input_model.glb" "inputs/input_model.glb"
                  rm -f "$fbx_candidate"
                fi
              else
                echo "Confirmed Binary FBX format for $fbx_candidate. Ready for native Blender import."
              fi
            fi
          done

          ls -la input_model.* inputs/ 2>/dev/null || echo "No uploaded 3D model detected."

      # Step 5: Execute Blender Process (Boot Blender First, Clean Separation, Dynamic Gemini Agent)
      - name: Execute Blender Python Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_GENERATOR: |
            import json, os, sys, base64, textwrap

            event_path = os.environ.get('GITHUB_EVENT_PATH')
            payload = {}
            if event_path and os.path.exists(event_path):
                try:
                    with open(event_path, 'r', encoding='utf-8') as ef:
                        event_data = json.load(ef)
                        payload = event_data.get('client_payload', {})
                except Exception as pe:
                    print(f"Event payload read warning: {pe}")

            has_imported_model = (
                bool(payload.get('model_path')) or
                bool(payload.get('input_model_b64')) or
                os.path.exists('input_model.glb') or os.path.exists('inputs/input_model.glb') or
                os.path.exists('input_model.fbx') or os.path.exists('inputs/input_model.fbx')
            )

            is_raw_script = False
            if not has_imported_model:
                if bool(payload.get('isRawUserScript', False)) or bool(payload.get('is_raw_script', False)):
                    is_raw_script = True

            user_prompt = payload.get('user_prompt', payload.get('prompt', '')).strip()
            selected_model = payload.get('selected_model', 'gemini-2.5-flash').strip()
            gemini_api_key = os.environ.get('GEMINI_API_KEY', '').strip() or payload.get('gemini_api_key', '').strip()

            raw_bpy_script = ''
            if 'bpy_script_b64' in payload and payload['bpy_script_b64'].strip():
                raw_bpy_script = base64.b64decode(payload['bpy_script_b64']).decode('utf-8', errors='ignore')
            elif 'bpy_script' in payload and payload['bpy_script'].strip():
                cand = payload['bpy_script'].strip()
                if cand.startswith('b64:'):
                    raw_bpy_script = base64.b64decode(cand[4:]).decode('utf-8', errors='ignore')
                else:
                    raw_bpy_script = cand

            with open('task_config.json', 'w', encoding='utf-8') as cfg_f:
                json.dump({
                    "is_raw_script": is_raw_script,
                    "has_imported_model": has_imported_model,
                    "user_prompt": user_prompt,
                    "selected_model": selected_model,
                    "gemini_api_key": gemini_api_key,
                    "has_raw_bpy_script": bool(raw_bpy_script.strip())
                }, cfg_f)

            if raw_bpy_script.strip():
                with open('input_script.py', 'w', encoding='utf-8') as sf:
                    sf.write(raw_bpy_script)

            runner_code = r'''
            import bpy, os, sys, json, math, re, mathutils, urllib.request, urllib.error, traceback

            os.makedirs('output', exist_ok=True)

            # Wipe default startup objects
            bpy.ops.object.select_all(action='SELECT')
            bpy.ops.object.delete(use_global=False)

            with open('task_config.json', 'r', encoding='utf-8') as f:
                cfg = json.load(f)

            is_raw_script = cfg.get("is_raw_script", False)
            has_imported_model = cfg.get("has_imported_model", False)
            user_prompt = cfg.get("user_prompt", "").strip()
            selected_model = cfg.get("selected_model", "gemini-2.5-flash")
            gemini_api_key = cfg.get("gemini_api_key", "").strip()
            has_raw_bpy_script = cfg.get("has_raw_bpy_script", False)

            def sanitize_blender_code(code_str):
                code_str = code_str.replace("scene.fps", "scene.render.fps")
                code_str = re.sub(r"addon_utils\.enable\(['\"](?:rigify|archimesh)['\"]\)", "pass", code_str)
                code_str = re.sub(r"['\"]High Contrast['\"]", "'AgX - High Contrast'", code_str)
                code_str = re.sub(r"['\"]Very High Contrast['\"]", "'AgX - Very High Contrast'", code_str)
                code_str = re.sub(r"\.sun_azimuth\b", ".sun_rotation", code_str)
                code_str = re.sub(r"\.sun_elevation\b", ".sun_direction", code_str)
                code_str = re.sub(r"nodes\.ShaderNode([A-Za-z0-9_]+)\b", r"nodes.new(type='ShaderNode\1')", code_str)
                code_str = re.sub(r"^([ \t]*)(.*view_settings\.look\s*=.*)$", r"\1try:\n\1    \2\n\1except Exception: pass", code_str, flags=re.MULTILINE)
                return code_str

            # -------------------------------------------------------------------------
            # TRACK 1: RAW PYTHON AUTOMATION (STANDALONE PYTHON SCRIPT UPLOAD ONLY)
            # -------------------------------------------------------------------------
            if is_raw_script and not has_imported_model:
                print("Vynara Runner: Executing Track 1 [Raw Python 3D Model Creation]")
                if os.path.exists('input_script.py'):
                    with open('input_script.py', 'r', encoding='utf-8') as sf:
                        code = sf.read()
                    exec(sanitize_blender_code(code), globals())

                bpy.ops.export_scene.gltf(
                    filepath='output/model.glb',
                    export_format='GLB',
                    export_apply=False,
                    export_skins=True,
                    export_animations=False,
                    export_materials='EXPORT'
                )

                sc = bpy.context.scene
                sc.render.filepath = 'output/render.png'
                sc.render.engine = 'CYCLES'
                sc.cycles.device = 'CPU'
                sc.cycles.samples = 4
                bpy.ops.render.render(write_still=True)
                print("SUCCESS: Raw Python 3D Model and preview generated.")
                sys.exit(0)

            # -------------------------------------------------------------------------
            # TRACK 2: 3D IMPORT & ANIMATION (BOOT BLENDER FIRST -> TALK TO GEMINI)
            # -------------------------------------------------------------------------
            print("Vynara Runner: Executing Track 2 [Live Blender-First Scene & Animation]")

            imported_model = None
            for candidate in ['input_model.glb', 'inputs/input_model.glb', 'input_model.fbx', 'inputs/input_model.fbx', 'input_model.obj']:
                if os.path.exists(candidate):
                    ext = os.path.splitext(candidate)[1].lower()
                    if ext in ['.glb', '.gltf']:
                        bpy.ops.import_scene.gltf(filepath=candidate)
                        imported_model = candidate
                        break
                    elif ext == '.fbx':
                        bpy.ops.import_scene.fbx(filepath=candidate)
                        imported_model = candidate
                        break
                    elif ext == '.obj':
                        bpy.ops.wm.obj_import(filepath=candidate)
                        imported_model = candidate
                        break

            # Calculate real bounding box of all imported mesh objects
            mesh_objs = [o for o in bpy.data.objects if o.type == 'MESH']
            min_x = min_y = min_z = float('inf')
            max_x = max_y = max_z = float('-inf')
            for o in mesh_objs:
                for corner in [o.matrix_world @ mathutils.Vector(b) for b in o.bound_box]:
                    min_x, max_x = min(min_x, corner.x), max(max_x, corner.x)
                    min_y, max_y = min(min_y, corner.y), max(max_y, corner.y)
                    min_z, max_z = min(min_z, corner.z), max(max_z, corner.z)

            has_bounds = (min_x != float('inf'))
            center = mathutils.Vector(((min_x + max_x)/2.0, (min_y + max_y)/2.0, (min_z + max_z)/2.0)) if has_bounds else mathutils.Vector((0, 0, 0))
            dim = max(max_x - min_x, max_y - min_y, max_z - min_z) if has_bounds else 2.0
            dim = max(dim, 0.5)

            effective_prompt = user_prompt if user_prompt else "Cinematic dynamic 3D animation, road environment, photorealistic lighting, and camera tracking for imported model"

            if gemini_api_key:
                print(f"Calling Gemini API live from Blender using model: {selected_model}")
                url = f"https://generativelanguage.googleapis.com/v1beta/models/{selected_model}:generateContent?key={gemini_api_key}"

                system_inst = (
                    "You are a professional 3D technical director writing Python code inside a LIVE Blender 4.2 session.\n"
                    f"Active Scene State: Imported Model Present={bool(imported_model)}, Bounding Box Center={center}, Max Dimension={dim}m.\n"
                    "CRITICAL BLENDER 4.2 RULES:\n"
                    "1. Output ONLY executable Python code inside a ```python ``` code block.\n"
                    "2. Principled BSDF inputs: 'Base Color' requires 4-element RGBA (r, g, b, 1.0). 'Roughness', 'Metallic' are floats.\n"
                    "3. To create shader nodes, use nodes.new(type='ShaderNodeBsdfPrincipled'), NEVER nodes.ShaderNodeBsdfPrincipled.\n"
                    "4. Set scene.frame_start = 1 and scene.frame_end = 60. Set FPS via scene.render.fps = 24 (NEVER scene.fps).\n"
                    "5. MUST insert animation keyframes on camera or objects using obj.keyframe_insert(data_path='location', frame=...).\n"
                    "6. Color management: view_settings.look MUST be 'AgX - High Contrast' or 'AgX - Punchy' (NEVER 'High Contrast').\n"
                    "7. Never call addon_utils.enable('rigify') or archimesh.\n"
                    "8. Do not re-import the model; construct the road, environment geometry, camera rig, and animation keyframes around the existing mesh objects."
                )

                req_body = {
                    "contents": [{"parts": [{"text": f"User Creative Prompt: {effective_prompt}"}]}],
                    "systemInstruction": {"parts": [{"text": system_inst}]}
                }

                def query_gemini_code(body_payload):
                    req = urllib.request.Request(url, data=json.dumps(body_payload).encode('utf-8'), headers={'Content-Type': 'application/json'})
                    with urllib.request.urlopen(req, timeout=35) as resp:
                        resp_data = json.loads(resp.read().decode('utf-8'))
                        text = resp_data['candidates'][0]['content']['parts'][0]['text']
                        if '```python' in text:
                            return text.split('```python')[1].split('```')[0].strip()
                        elif '```' in text:
                            return text.split('```')[1].split('```')[0].strip()
                        return text.strip()

                try:
                    current_code = query_gemini_code(req_body)

                    # Multi-turn resilient repair loop (up to 3 turns)
                    for repair_turn in range(3):
                        sanitized = sanitize_blender_code(current_code)
                        try:
                            exec(sanitized, globals())
                            print(f"Gemini script executed successfully (Turn {repair_turn+1}).")
                            break
                        except Exception as live_err:
                            tb = traceback.format_exc()
                            print(f"Live Execution Error (Turn {repair_turn+1}/3): {live_err}")
                            if repair_turn == 2:
                                print("Max live repair attempts reached. Proceeding to universal export.")
                                break

                            repair_msg = f"The previous script failed with this Blender 4.2 exception:\n{tb}\nFix the error and output ONLY the complete corrected Python code."
                            req_body['contents'].append({"parts": [{"text": current_code}]})
                            req_body['contents'].append({"parts": [{"text": repair_msg}]})
                            current_code = query_gemini_code(req_body)

                except Exception as api_err:
                    print(f"Gemini API Live Call Warning: {api_err}")

            # --- UNIVERSAL RENDER & CAMERA RE-FRAMING STAGE ---
            sc = bpy.context.scene

            # Ensure World lighting exists
            if not sc.world:
                sc.world = bpy.data.worlds.new('Vynara_World')
            sc.world.use_nodes = True
            bg = sc.world.node_tree.nodes.get('Background')
            if not bg:
                bg = sc.world.node_tree.nodes.new('ShaderNodeBackground')
                out = sc.world.node_tree.nodes.get('World Output') or sc.world.node_tree.nodes.new('ShaderNodeOutputWorld')
                sc.world.node_tree.links.new(bg.outputs['Background'], out.inputs['Surface'])
            bg.inputs['Color'].default_value = (0.75, 0.85, 0.95, 1.0)
            bg.inputs['Strength'].default_value = max(float(bg.inputs['Strength'].default_value), 1.2)

            # Ensure Sunlight exists
            if not any(o.type == 'LIGHT' for o in bpy.data.objects):
                sdata = bpy.data.lights.new('Key_Sun', 'SUN')
                sdata.energy = 5.0
                sun = bpy.data.objects.new('Key_Sun', sdata)
                bpy.context.collection.objects.link(sun)
                sun.rotation_euler = (math.radians(50.0), math.radians(20.0), math.radians(-35.0))

            # Camera Framing: Ensure camera is at a clear 3/4 cinematic offset, never inside the car body
            cam = sc.camera
            if not cam:
                for o in bpy.data.objects:
                    if o.type == 'CAMERA':
                        cam = o; break
            if not cam:
                cdata = bpy.data.cameras.new('Universal_Camera')
                cam = bpy.data.objects.new('Universal_Camera', cdata)
                bpy.context.collection.objects.link(cam)
                sc.camera = cam

            cam.location = (center.x - dim * 1.8, center.y - dim * 2.2, center.z + dim * 1.1)
            cam_dir = center - cam.location
            cam.rotation_euler = cam_dir.to_track_quat('-Z', 'Y').to_euler()
            if cam.data:
                cam.data.clip_start = 0.1
                cam.data.clip_end = max(1000.0, dim * 50.0)

            # Guaranteed Animation Fallback: If no keyframes exist, create an active camera flyby so MP4 always renders
            has_anim = any(obj.animation_data and obj.animation_data.action and len(obj.animation_data.action.fcurves) > 0 for obj in bpy.data.objects)
            if not has_anim:
                print("Injecting dynamic camera flyby animation track (60 frames)...")
                sc.frame_start = 1
                sc.frame_end = 60
                sc.render.fps = 24
                cam.location = (center.x - dim * 2.2, center.y - dim * 2.5, center.z + dim * 1.2)
                cam.keyframe_insert(data_path='location', frame=1)
                cam.location = (center.x + dim * 1.8, center.y - dim * 1.8, center.z + dim * 0.9)
                cam.keyframe_insert(data_path='location', frame=60)
                has_anim = True

            # Export 3D Scene to model.glb
            for o in list(bpy.data.objects):
                if o.type == 'MESH' and any(k in o.name.lower() for k in ['fog', 'volume', 'domain', 'atmosphere']):
                    bpy.data.objects.remove(o, do_unlink=True)

            bpy.ops.export_scene.gltf(
                filepath='output/model.glb',
                export_format='GLB',
                export_apply=False,
                export_skins=True,
                export_animations=True,
                export_materials='EXPORT'
            )
            print("SUCCESS: 3D Scene exported to output/model.glb")

            # Render High-Quality Cycles Preview Frame
            sc.render.engine = 'CYCLES'
            sc.cycles.device = 'CPU'
            sc.cycles.samples = 4
            sc.cycles.max_bounces = 4
            sc.render.resolution_x = 960
            sc.render.resolution_y = 540
            sc.render.filepath = 'output/render.png'
            sc.frame_set(sc.frame_start)
            bpy.ops.render.render(write_still=True)
            print("SUCCESS: Preview snapshot complete: output/render.png")

            # Render Cinematic MP4 Video Sequence
            if has_anim and not os.path.exists('output/cinematic.mp4'):
                total_frames = max(1, sc.frame_end - sc.frame_start + 1)
                print(f"Active Animation: Rendering {total_frames} frames to cinematic.mp4...")
                sc.render.image_settings.file_format = 'FFMPEG'
                sc.render.ffmpeg.format = 'MPEG4'
                sc.render.ffmpeg.codec = 'H264'
                sc.render.ffmpeg.constant_rate_factor = 'MEDIUM'
                sc.render.ffmpeg.ffmpeg_preset = 'REALTIME'
                sc.render.filepath = 'output/cinematic.mp4'
                sc.cycles.samples = 2
                sc.cycles.max_bounces = 3
                bpy.ops.render.render(animation=True)
                print("SUCCESS: Dynamic MP4 video rendered: output/cinematic.mp4")
            '''

            with open('run_task.py', 'w', encoding='utf-8') as rf:
                rf.write(textwrap.dedent(runner_code).strip() + '\n')
        run: |
          mkdir -p output
          
          python3 -c "$TASK_GENERATOR"

          # Run headless Blender with live controller
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -ac +extension GLX +render" /opt/blender/blender -b -P run_task.py 2>&1 | tee output/blender_execution.log || true

          # Capture exact terminal traceback if failed
          python3 -c '
          import re, os
          if os.path.exists("output/blender_execution.log"):
              with open("output/blender_execution.log", "r", encoding="utf-8", errors="ignore") as lf:
                  content = lf.read()
              tb_match = re.search(r"(Traceback \(most recent call last\):[\s\S]+?(?:[A-Za-z0-9_]+Error|[A-Za-z0-9_]+Exception):[^\n]+)", content)
              if tb_match:
                  with open("output/error.txt", "w", encoding="utf-8") as ef:
                      ef.write(tb_match.group(1).strip() + "\n")
                  print("EXTRACTED TRACEBACK TO error.txt:\n" + tb_match.group(1).strip())
          '

          # Normalize any exported .glb to model.glb
          if [ ! -f output/model.glb ]; then
            FIRST_GLB=$(ls output/*.glb 2>/dev/null | head -n 1)
            if [ -n "$FIRST_GLB" ]; then
              cp "$FIRST_GLB" output/model.glb
              echo "Normalized $FIRST_GLB -> output/model.glb"
            fi
          fi

          # Normalize any rendered .mp4 to cinematic.mp4
          if [ ! -f output/cinematic.mp4 ]; then
            FIRST_MP4=$(ls output/*.mp4 2>/dev/null | head -n 1)
            if [ -n "$FIRST_MP4" ]; then
              cp "$FIRST_MP4" output/cinematic.mp4
              echo "Normalized $FIRST_MP4 -> output/cinematic.mp4"
            fi
          fi

          # Verify output assets
          if [ -f output/model.glb ]; then
            echo "SUCCESS: model.glb generated successfully."
            if [ -f output/cinematic.mp4 ]; then
              echo "SUCCESS: cinematic.mp4 video generated successfully ($(stat -c%s output/cinematic.mp4) bytes)."
            fi
            exit 0
          else
            if [ ! -f output/error.txt ]; then
              echo "ERROR: Blender execution halted without generating model.glb" > output/error.txt
              tail -n 40 output/blender_execution.log >> output/error.txt
            fi
            exit 1
          fi

      # Step 6: Upload finished assets (GLB model, Cycles preview, Cinematic MP4 video, and logs)
      - name: Upload Finished Model and Render Preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.client_payload.asset_id }}
          path: output/
          retention-days: 3
          if-no-files-found: warn